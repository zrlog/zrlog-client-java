name: Release Linux AMD64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    concurrency:
      group: deploy-zrlogctl-linux-amd64
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"
      - name: Install native linker dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build release binary
        id: build
        run: ./bin/package-linux-amd64.sh /tmp/zrlogctl-dist --prepare-only
      - name: Process Linux binary
        uses: zrlog/zrlog-process-artifact@5b539f9a93403c981b9e36554ffb8d3d3e7e8b33 # v1.0.1
        with:
          artifact-file: ${{ steps.build.outputs.artifact_file }}
          artifact-name: ${{ steps.build.outputs.artifact_name }}
          artifact-version: ${{ steps.build.outputs.artifact_version }}
          artifact-architecture: ${{ steps.build.outputs.artifact_architecture }}
          service-url: https://webdav.zrlog.com/artifact
          service-token: ${{ secrets.ARTIFACT_SERVICE_TOKEN }}
      - name: Verify binary and finalize release tree
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.artifact_version }}
        run: bash bin/finalize-linux-amd64.sh /tmp/zrlogctl-dist "$RELEASE_VERSION"
      - name: Attest release binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.artifact_file }}
      - name: Configure object storage
        run: |
          aws configure set aws_access_key_id "${{ secrets.SECRET_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.SECRET_KEY }}"
          aws configure set region auto
          aws configure set output json
      - name: Upload immutable version
        run: >-
          aws s3 cp "/tmp/zrlogctl-dist/ctl/release/${{ steps.build.outputs.artifact_version }}"
          "s3://${{ secrets.BUCKET }}/ctl/release/${{ steps.build.outputs.artifact_version }}/"
          --recursive --checksum-algorithm CRC32 --endpoint-url "${{ secrets.HOST }}"
      - name: Publish installer
        run: >-
          aws s3 cp /tmp/zrlogctl-dist/ctl/install.sh
          "s3://${{ secrets.BUCKET }}/ctl/install"
          --content-type "text/plain; charset=utf-8" --cache-control no-cache
          --endpoint-url "${{ secrets.HOST }}"
      - name: Publish latest manifest
        run: >-
          aws s3 cp /tmp/zrlogctl-dist/ctl/release/latest.json
          "s3://${{ secrets.BUCKET }}/ctl/release/latest.json"
          --content-type application/json --cache-control no-cache
          --endpoint-url "${{ secrets.HOST }}"
